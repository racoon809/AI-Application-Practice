# Purpose : "python -m pytest -q" from this folder runs both suites:
#           desktop_version/tests (pipeline + network, 43 tests) and
#           tests (desktop vs web parity, 7 tests, needs Chromium)
[pytest]
testpaths = desktop_version/tests tests
addopts = -p no:cacheprovider
