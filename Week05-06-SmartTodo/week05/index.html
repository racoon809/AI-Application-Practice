<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리 앱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>할 일 관리</h1>
        <p class="sub" id="autoStatus">자동 분류: 확인 후 적용</p>
      </div>
      <button id="themeToggle" class="btn ghost" type="button" aria-pressed="false">🌙 다크 모드</button>
    </header>

    <!-- 진행률 대시보드 (4주차 3단계) -->
    <section class="card dashboard" aria-label="진행률 대시보드">
      <div class="overall">
        <span class="label">전체 진행률</span>
        <strong id="overallPercent">0%</strong>
        <span id="overallText" class="muted">0 / 0개 완료</span>
      </div>
      <div class="progress"><i id="overallBar"></i></div>
      <div class="mini-progress">
        <div><span class="dot" data-category="업무"></span>업무 <small data-progress-text="업무">0/0</small><div class="progress sm"><i data-progress="업무"></i></div></div>
        <div><span class="dot" data-category="개인"></span>개인 <small data-progress-text="개인">0/0</small><div class="progress sm"><i data-progress="개인"></i></div></div>
        <div><span class="dot" data-category="공부"></span>공부 <small data-progress-text="공부">0/0</small><div class="progress sm"><i data-progress="공부"></i></div></div>
      </div>
    </section>

    <!-- 입력 + [5주차] 스마트 키워드 분석 -->
    <form id="todoForm" class="card add-form" autocomplete="off">
      <div class="row">
        <label class="sr-only" for="todoInput">새 할 일</label>
        <input id="todoInput" type="text" placeholder="새로운 할 일을 입력하세요… ( / 키로 바로 입력)" maxlength="100">
        <label class="sr-only" for="categorySelect">카테고리</label>
        <select id="categorySelect">
          <option value="업무">업무</option>
          <option value="개인" selected>개인</option>
          <option value="공부">공부</option>
        </select>
        <button class="btn primary" type="submit">추가</button>
      </div>
      <p id="smartHint" class="smart-hint" aria-live="polite"></p>
      <div class="row tools">
        <button id="reclassifyBtn" class="btn" type="button">🔄 자동 재분류</button>
        <button id="settingsBtn" class="btn" type="button">⚙️ 분류 설정</button>
      </div>
    </form>

    <!-- 필터 · 검색 · 정렬 -->
    <section class="card list-card">
      <div class="filters" role="group" aria-label="카테고리 필터">
        <button class="filter-btn" data-filter="all" type="button">전체 <span data-count="all">0</span></button>
        <button class="filter-btn" data-filter="업무" type="button">업무 <span data-count="업무">0</span></button>
        <button class="filter-btn" data-filter="개인" type="button">개인 <span data-count="개인">0</span></button>
        <button class="filter-btn" data-filter="공부" type="button">공부 <span data-count="공부">0</span></button>
      </div>
      <div class="row">
        <label class="sr-only" for="searchInput">할 일 검색</label>
        <input id="searchInput" type="search" placeholder="할 일 검색…">
        <label class="sr-only" for="sortSelect">정렬</label>
        <select id="sortSelect">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="activeFirst">미완료 먼저</option>
          <option value="category">카테고리순</option>
          <option value="alpha">가나다순</option>
        </select>
      </div>
      <ul id="todoList" class="todo-list"></ul>
      <p id="emptyState" class="empty" hidden>첫 할 일을 추가해 보세요!</p>
      <div class="row footer-tools">
        <button id="clearCompleted" class="btn" type="button">완료된 항목 삭제</button>
        <span class="spacer"></span>
        <button id="exportBtn" class="btn" type="button">내보내기</button>
        <button id="importBtn" class="btn" type="button">가져오기</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </section>

    <!-- 오늘의 격언 (4주차 5단계) -->
    <section class="card quote-card" aria-label="오늘의 격언">
      <p id="quote" class="quote">“”</p>
      <p id="quoteAuthor" class="muted"></p>
      <button id="newQuote" class="btn ghost" type="button">다른 격언</button>
    </section>

    <p class="shortcuts muted">단축키: <kbd>/</kbd> 입력 · <kbd>Alt</kbd>+<kbd>D</kbd> 다크 모드 · <kbd>Alt</kbd>+<kbd>0~3</kbd> 필터 · 항목 더블 클릭 = 수정</p>
  </div>

  <!-- [5주차] 추천 확인 창 -->
  <dialog id="suggestDialog" class="dialog">
    <h2>카테고리 추천</h2>
    <p id="suggestText"></p>
    <p id="suggestReason" class="muted"></p>
    <div class="row end">
      <button id="keepOriginal" class="btn" type="button">그대로 등록</button>
      <button id="applySuggest" class="btn primary" type="button">추천대로 등록</button>
    </div>
  </dialog>

  <!-- [5주차] 자동 재분류 창 -->
  <dialog id="reclassifyDialog" class="dialog">
    <h2>자동 재분류</h2>
    <p class="muted">키워드 분석 결과 카테고리가 달라 보이는 항목입니다. 바꿀 항목만 체크하세요.</p>
    <ul id="reclassifyList" class="reclassify-list"></ul>
    <div class="row end">
      <button id="cancelReclassify" class="btn" type="button">취소</button>
      <button id="applyReclassify" class="btn primary" type="button">선택 항목 적용</button>
    </div>
  </dialog>

  <!-- [5주차] 분류 설정 창 -->
  <dialog id="settingsDialog" class="dialog">
    <h2>분류 설정</h2>
    <label class="switch"><input id="autoToggle" type="checkbox"> 키워드 기반 자동 분류 사용</label>
    <fieldset>
      <legend>추천이 다를 때</legend>
      <label><input type="radio" name="classifyMode" value="confirm" id="modeConfirm"> 확인 창으로 물어보기</label>
      <label><input type="radio" name="classifyMode" value="auto" id="modeAuto"> 바로 추천 카테고리로 저장</label>
    </fieldset>
    <fieldset>
      <legend>내 키워드 추가 (쉼표로 구분)</legend>
      <label for="kwWork">업무 <small class="muted" data-default-keywords="업무"></small></label>
      <input id="kwWork" data-keywords="업무" placeholder="예: 스프린트, 데일리 스크럼">
      <label for="kwPersonal">개인 <small class="muted" data-default-keywords="개인"></small></label>
      <input id="kwPersonal" data-keywords="개인" placeholder="예: 강아지 산책, 넷플릭스">
      <label for="kwStudy">공부 <small class="muted" data-default-keywords="공부"></small></label>
      <input id="kwStudy" data-keywords="공부" placeholder="예: 인공지능활용실습, 자료구조">
    </fieldset>
    <div class="row end">
      <button id="cancelSettings" class="btn" type="button">취소</button>
      <button id="saveSettings" class="btn primary" type="button">저장</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="../core.js"></script>
  <script src="ui.js"></script>
</body>
</html>
